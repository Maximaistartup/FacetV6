<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Viewer</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background-color: #f0f0f0;
  }
  .container {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    text-align: center;
  }
  .image-wrapper {
    position: relative;
    display: inline-block;
    margin-bottom: 20px;
  }
  img {
    max-width: 400px;
    max-height: 500px;
    border-radius: 8px;
    display: block;
    border: 2px solid #ddd;
    background: #eee;
  }
  .caption {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 0.5px;
  }
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background-color: #007bff;
    color: white;
    transition: background 0.2s;
  }
  button:hover { background-color: #0056b3; }
  button.active { background-color: #28a745; }
  button.active:hover { background-color: #218838; }
</style>
</head>
<body>

<div class="container">
  <div class="image-wrapper">
    <img id="displayImage" src="" alt="Profile Image">
    <div class="caption" id="captionOverlay">Blue · Front</div>
  </div>

  <div class="controls">
    <button onclick="setImage('Blue', 'Front')" id="btn-Blue-Front">Blue · Front</button>
    <button onclick="setImage('Blue', 'Side')"  id="btn-Blue-Side">Blue · Side</button>
    <button onclick="setImage('Grey', 'Front')" id="btn-Grey-Front">Grey · Front</button>
    <button onclick="setImage('Grey', 'Side')"  id="btn-Grey-Side">Grey · Side</button>
  </div>
</div>

<script>
  // ============================================================
  // PASTE YOUR FOUR BASE64 STRINGS BELOW, BETWEEN THE BACKTICKS.
  // Each string must start with:  data:image/png;base64,
  // Keep the backticks (`) at the start and end of each value.
  // ============================================================

  const IMAGES = {

    Blue: {
      // ---------- SLOT 1: BLUE BACKGROUND, FRONT-FACING ----------
      Front: `PASTE_BLUE_FRONT_BASE64_HERE`,

      // ---------- SLOT 2: BLUE BACKGROUND, SIDE PROFILE ----------
      Side: `PASTE_BLUE_SIDE_BASE64_HERE`
    },

    Grey: {
      // ---------- SLOT 3: GREY BACKGROUND, FRONT-FACING ----------
      Front: `PASTE_GREY_FRONT_BASE64_HERE`,

      // ---------- SLOT 4: GREY BACKGROUND, SIDE PROFILE ----------
      Side: `PASTE_GREY_SIDE_BASE64_HERE`
    }

  };

  // ============================================================
  // LOGIC — do not edit below this line
  // ============================================================

  const displayImage  = document.getElementById('displayImage');
  const captionOverlay = document.getElementById('captionOverlay');

  function setImage(subject, view) {
    const src = IMAGES[subject][view];

    if (!src || src.startsWith('PASTE_')) {
      displayImage.src = '';
      displayImage.alt = `Missing image for ${subject} · ${view}`;
    } else {
      displayImage.src = src;
    }

    captionOverlay.textContent = `${subject} · ${view}`;

    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    const activeBtn = document.getElementById(`btn-${subject}-${view}`);
    if (activeBtn) activeBtn.classList.add('active');
  }

  // Load Blue · Front by default on page open
  setImage('Blue', 'Front');
</script>

</body>
</html>
